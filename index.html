<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <header>

    <main>
        <div class="searcher">
            <select id="marca-search" name="marca-search">
                <option value="">Marca</option>
            </select>
            <select id="modelo-search" name="modelo-search">
                <option value="">Modelo</option>
            </select>
            <select id="local-search" name="local-search">
                <option value="">Cidade</option>
            </select>
        </div>
        <div class="galeriaCards" id="galeriaCards"></div>
    </main>
    <script>
        async function fetchData(url, method = 'GET', data = null) {
            const options = { method };
            if (data) {
                options.body = data;
                options.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            }
            const response = await fetch(url, options);
            return response.json();
        }

        function populateSelect(select, options, defaultOption) {
            select.innerHTML = `<option value="">${defaultOption}</option>`;
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });
        }

        async function loadMarcas() {
            const data = await fetchData('controller_publico.php?acao=listarMarcas');
            if (!data.error) {
                populateSelect(document.getElementById('marca-search'), data, 'Marca');
            }
        }

        async function loadModelos(marca) {
            const formData = new FormData();
            formData.append('marca', marca);
            const data = await fetchData('controller_publico.php?acao=listarModelos', 'POST', new URLSearchParams(formData));
            if (!data.error) {
                populateSelect(document.getElementById('modelo-search'), data, 'Modelo');
            }
        }

        async function loadCidades(marca, modelo) {
            const formData = new FormData();
            formData.append('marca', marca);
            formData.append('modelo', modelo);
            const data = await fetchData('controller_publico.php?acao=listarCidades', 'POST', new URLSearchParams(formData));
            if (!data.error) {
                populateSelect(document.getElementById('local-search'), data, 'Cidade');
            }
        }

        async function loadAnuncios() {
            const marca = document.getElementById('marca-search').value;
            const modelo = document.getElementById('modelo-search').value;
            const cidade = document.getElementById('local-search').value;
            const formData = new FormData();
            if (marca) formData.append('marca', marca);
            if (modelo) formData.append('modelo', modelo);
            if (cidade) formData.append('cidade', cidade);
            const data = await fetchData('controller_publico.php?acao=listarAnuncios', 'POST', new URLSearchParams(formData));
            const galeria = document.getElementById('galeriaCards');
            galeria.innerHTML = '';
            if (!data.error) {
                data.forEach(anuncio => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h2 class="marca-carro">${anuncio.marca}</h2>
                        <img src="uploads/${anuncio.foto}" alt="foto" class="img-carro">
                        <h3 class="modelo-carro">${anuncio.modelo}</h3>
                        <h3 class="ano-carro">${anuncio.ano}</h3>
                        <h3 class="cidade-carro">${anuncio.cidade}</h3>
                        <h3 class="valor-carro">R$ ${anuncio.valor}</h3>
                        <a href="exibicaoDetalhada.html?id=${anuncio.id}" class="btn-primary">Ver Detalhes</a>
                    `;
                    galeria.appendChild(card);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadMarcas();
            loadAnuncios();

            document.getElementById('marca-search').addEventListener('change', async (e) => {
                const marca = e.target.value;
                document.getElementById('modelo-search').innerHTML = '<option value="">Modelo</option>';
                document.getElementById('local-search').innerHTML = '<option value="">Cidade</option>';
                if (marca) await loadModelos(marca);
                loadAnuncios();
            });

            document.getElementById('modelo-search').addEventListener('change', async (e) => {
                const marca = document.getElementById('marca-search').value;
                const modelo = e.target.value;
                document.getElementById('local-search').innerHTML = '<option value="">Cidade</option>';
                if (marca && modelo) await loadCidades(marca, modelo);
                loadAnuncios();
            });

            document.getElementById('local-search').addEventListener('change', loadAnuncios);
        });
    </script>
